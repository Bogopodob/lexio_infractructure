# Lexio frontend: app.lexio.curatio.space (static SPA, prod build).
# HTTPS terminates on the HOST nginx; this block only sees plain HTTP
# from 127.0.0.1, so no ssl/listen 443 here.
server {
    listen 80;
    server_name app.lexio.curatio.space;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml image/svg+xml;

    root /var/www/frontend/app;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite build output: hashed files are immutable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. NOTE: index.html itself must NOT be cached long —
    # the host nginx sets that (see host-nginx-lexio.conf.example).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
