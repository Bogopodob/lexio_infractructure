# Lexio backend: api.lexio.curatio.space (php-fpm, prod).
# Mirrors curatio's container nginx one level up (no soketi/storage extras:
# Lexio doesn't use them). HTTPS terminates on the HOST nginx.
server {
    listen 80;
    server_name api.lexio.curatio.space;
    absolute_redirect off;

    client_max_body_size 64M;
    client_body_timeout 120;
    client_header_timeout 60;
    send_timeout 300;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml image/svg+xml;

    root /var/www/backend/public;
    index index.php index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api {
        return 301 /api/;
    }

    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param PATH_INFO "";
        fastcgi_pass php:9000;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_connect_timeout 10;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_connect_timeout 10;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        return 404;
    }
}
