# Lexio PRODUCTION stack (VPS, /var/www/lexio).
# Mirrors curatio's architecture one level up: single nginx (static SPA + php-fpm),
# no dev containers, no published DB ports. Local dev files are untouched —
# this file lives next to them, not instead of them.
#
# Layout on the server (same relative shape as locally):
#   /var/www/lexio/frontend
#   /var/www/lexio/backend
#   /var/www/lexio/infractructure   (this repo; CWD for compose)
#   /var/www/lexio/frontend-dist    (built by deploy.sh, git-ignored)

services:
  php:
    container_name: ${PHP_CONTAINER_NAME}
    build:
      context: ../..
      dockerfile: infractructure/backend/Dockerfile
    user: "${APP_UID}:${APP_GID}"
    working_dir: /var/www/backend
    volumes:
      - ../../backend:/var/www/backend
      - ./php/prod-php.ini:/usr/local/etc/php/conf.d/prod.ini:ro
      - backend_storage:/var/www/backend/storage/app/public
    environment:
      XDEBUG_MODE: "off"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lexio

  nginx:
    container_name: ${NGINX_CONTAINER_NAME}
    image: nginx:1.27-alpine
    # Localhost-bound: only the host nginx (80/443) talks to this container,
    # so trusting X-Forwarded-* in Laravel is safe.
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"
    volumes:
      - ../../backend:/var/www/backend:ro
      - ../../frontend-dist:/var/www/frontend/app:ro
      - ./nginx/app.conf:/etc/nginx/conf.d/app.conf:ro
      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
    depends_on:
      - php
    networks:
      - lexio

  postgres:
    container_name: ${POSTGRES_CONTAINER_NAME}
    image: postgres:17-alpine
    # No published ports on prod: DB is reachable only inside lexio_network.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lexio

volumes:
  postgres_data:
  backend_storage:

networks:
  lexio:
    name: lexio_network
